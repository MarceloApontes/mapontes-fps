<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="MAPONTES FPS — jogo de ação em primeira pessoa direto no navegador.">
  <title>MAPONTES FPS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #101b2b; }
    body { overscroll-behavior: none; }
    #renderCanvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
    #falhaInicializacao { display: none; position: fixed; inset: 0; z-index: 10000; padding: 24px; align-items: center; justify-content: center; color: #fff; background: #101b2b; font: 16px/1.5 Arial, sans-serif; text-align: center; }
    #falhaInicializacao.mostrar { display: flex; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas" aria-label="MAPONTES FPS"></canvas>
  <div id="falhaInicializacao" role="alert"></div>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const painelFalha = document.getElementById("falhaInicializacao");
    let engine;
    function mostrarFalhaInicializacao(erro) {
      console.error("Falha ao iniciar MAPONTES FPS:", erro);
      const mensagem = String(erro?.message || erro || "erro desconhecido");
      painelFalha.textContent = /webgl|context/i.test(mensagem)
        ? "Seu navegador não conseguiu iniciar o WebGL, necessário para renderizar o jogo. No Edge, ative ‘Usar aceleração gráfica quando disponível’ em Configurações > Sistema e desempenho e reinicie o navegador. Se já estiver ativo, atualize o navegador e o driver de vídeo. Detalhe: " + mensagem
        : "Não foi possível iniciar o jogo. Confira sua conexão com a internet e atualize a página. Detalhe: " + mensagem;
      painelFalha.classList.add("mostrar");
    }

    try {
      if (!window.BABYLON) throw new Error("A biblioteca Babylon.js não carregou. Confira a conexão com a internet.");
      engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: false,
        stencil: true,
        powerPreference: "high-performance"
      });

const createScene = function () {
    // Origem unica de todos os arquivos (texturas, sons, modelos, icones...).
    // Alternativas: raw.githubusercontent.com/MarceloApontes/mapontes-fps/main/
    //               marceloapontes.github.io/mapontes-fps/  (GitHub Pages)
    const BASE_ARQUIVOS = "https://cdn.jsdelivr.net/gh/MarceloApontes/mapontes-fps@main/";
    let escalaUI = 1;            // fator de resolucao aplicado (1 = normal)
    let efeitosReduzidos = false; // modo BAIXO / AUTO pesado: menos particulas
    const TECLAS_WASD = ["KeyW", "KeyA", "KeyS", "KeyD"];
    const TECLAS_MOVIMENTO = ["KeyW", "KeyA", "KeyS", "KeyD",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.55, 0.75, 0.92, 1);
    scene.collisionsEnabled = true;
    scene.skipPointerMovePicking = true; // FPS com pointer lock: sem picking a cada movimento do mouse

    // Iluminacao diurna ensolarada: ceu claro como luz ambiente e sol direcional.
    const luz = new BABYLON.HemisphericLight(
        "luzCeuDiurno125", new BABYLON.Vector3(0.15, 1, 0.08), scene
    );
    luz.intensity = 0.72;
    luz.diffuse = new BABYLON.Color3(0.82, 0.89, 1.0);
    luz.groundColor = new BABYLON.Color3(0.42, 0.39, 0.32);
    const luzSolar125 = new BABYLON.DirectionalLight(
        "solDiurno125", new BABYLON.Vector3(0.45, -1, 0.12), scene
    );
    luzSolar125.intensity = 1.25;
    luzSolar125.diffuse = new BABYLON.Color3(1.0, 0.94, 0.82);
    luzSolar125.specular = new BABYLON.Color3(0.9, 0.88, 0.78);

    // Panorama 360 equiretangular 2:1, com linha do horizonte natural.
    // Nome v2 evita que o navegador reutilize a textura antiga em cache.
    const ceuPanoramico127 = new BABYLON.PhotoDome(
        "ceuDiurno146",
        BASE_ARQUIVOS + "texturas/panorama-rondonia-360-v3.png",
        { resolution: 32, size: 1000, useDirectMapping: false },
        scene
    );
    // Valor abaixo de 1 aproxima a imagem do panorama sem alterar a camera FPS.
    ceuPanoramico127.fovMultiplier = 0.88;
    if (ceuPanoramico127.mesh) {
        ceuPanoramico127.mesh.isPickable = false;
        ceuPanoramico127.mesh.checkCollisions = false;
        ceuPanoramico127.mesh.infiniteDistance = true;
    }

    const camera = new BABYLON.UniversalCamera(
        "jogador", new BABYLON.Vector3(0, 1.7, -12), scene
    );
    camera.minZ = 0.05;
    camera.fov = Math.PI / 3; // FOV do mundo: 60 graus; independente do modelo da arma
    camera.inertia = 0.15;
    camera.angularSensibility = 2500;
    camera.speed = 0.35;
    camera.keysUp = [87];
    camera.keysDown = [83];
    camera.keysLeft = [65];
    camera.keysRight = [68];
    camera.checkCollisions = true;
    camera.ellipsoid = new BABYLON.Vector3(0.4, 0.8, 0.4);

    function material(nome, cor) {
        const m = new BABYLON.StandardMaterial(nome, scene);
        m.diffuseColor = BABYLON.Color3.FromHexString(cor);
        return m;
    }

    const matChao = material("matChao", "#ffffff");
    const texturaPiso = new BABYLON.Texture(
        BASE_ARQUIVOS + "texturas/piso-madeira.png",
        scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
        () => console.info("MAPONTES FPS: textura do piso de madeira carregada"),
        (mensagem) => console.warn("MAPONTES FPS: textura do piso indisponivel:", mensagem)
    );
    texturaPiso.uScale = 7;
    texturaPiso.vScale = 7;
    texturaPiso.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    texturaPiso.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    matChao.diffuseTexture = texturaPiso;
    matChao.specularColor = new BABYLON.Color3(0.06, 0.06, 0.06);

    function materialTexturizado(nome, arquivo, repeticaoU, repeticaoV, corReserva) {
        const m = material(nome, corReserva);
        m.diffuseColor = new BABYLON.Color3(1, 1, 1);
        m.specularColor = new BABYLON.Color3(0.035, 0.035, 0.035);
        const tex = new BABYLON.Texture(
            BASE_ARQUIVOS + "texturas/" + arquivo,
            scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
            () => console.info("MAPONTES FPS: textura carregada:", arquivo),
            (erro) => {
                console.warn("MAPONTES FPS: textura indisponivel:", arquivo, erro);
                m.diffuseTexture = null;
            }
        );
        tex.uScale = repeticaoU;
        tex.vScale = repeticaoV;
        tex.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
        tex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
        m.diffuseTexture = tex;
        return m;
    }
    const matConteinerLateral = materialTexturizado(
        "conteinerLateral", "conteiner-lateral.png", 1, 1, "#6b705a");
    const matConteinerPortas = materialTexturizado(
        "conteinerPortas", "conteiner-portas.png", 1, 1, "#6b705a");
    const matConteinerFrente = materialTexturizado(
        "conteinerFrente", "conteiner-frente.png", 1, 1, "#6b705a");
    const matConteinerTeto = materialTexturizado(
        "conteinerTeto", "conteiner-teto.png", 1, 1, "#6b705a");
    for (const mat of [matConteinerLateral, matConteinerPortas, matConteinerFrente]) {
        if (mat.diffuseTexture) {
            mat.diffuseTexture.vScale = -1;
            mat.diffuseTexture.vOffset = 1;
        }
    }
    if (matConteinerLateral.diffuseTexture) {
        matConteinerLateral.diffuseTexture.uScale = 1;
        matConteinerLateral.diffuseTexture.uOffset = 0;
    }
    if (matConteinerTeto.diffuseTexture) {
        matConteinerTeto.diffuseTexture.uScale = -1;
        matConteinerTeto.diffuseTexture.uOffset = 1;
        matConteinerTeto.diffuseTexture.vScale = -1;
        matConteinerTeto.diffuseTexture.vOffset = 1;
    }
    const matConteinerLateralOposta = materialTexturizado(
        "conteinerLateralOposta", "conteiner-lateral.png", 1, 1, "#6b705a");
    if (matConteinerLateralOposta.diffuseTexture) {
        matConteinerLateralOposta.diffuseTexture.uScale = 1;
        matConteinerLateralOposta.diffuseTexture.uOffset = 0;
        matConteinerLateralOposta.diffuseTexture.vScale = -1;
        matConteinerLateralOposta.diffuseTexture.vOffset = 1;
    }
    const matCaixa = new BABYLON.MultiMaterial("matConteinerCompleto", scene);
    matCaixa.subMaterials = [
        matConteinerLateral, matConteinerLateralOposta,
        matConteinerPortas, matConteinerFrente,
        matConteinerTeto, matConteinerTeto
    ];
    for (const mat of [matConteinerPortas, matConteinerFrente]) {
        const tex = mat.diffuseTexture;
        if (tex) {
            tex.uRotationCenter = 0.5;
            tex.vRotationCenter = 0.5;
            tex.wAng = mat === matConteinerPortas ? -Math.PI / 2 : Math.PI / 2;
        }
    }
    const matMuro = materialTexturizado(
        "matMuroConcreto", "muro-concreto.png?v=292", 1, 1, "#aaaaaa"
    );
    const matMuroPlataforma = materialTexturizado(
        "matPlataformaConcreto", "muro-concreto.png?v=292", 1, 1, "#aaaaaa"
    );
    const matMuroLateralNovo = materialTexturizado(
        "matMuroLateralNovo", "muro-lateral-concreto.png?v=295", 1, 1, "#b8b8b8"
    );
    const matBarreira = materialTexturizado(
        "matBarreiraConcreto", "barreira-concreto.png?v=295", 1, 1, "#aaaaaa"
    );
    const matArma = material("matArma", "#20242b");
    const matDetalhe = material("matDetalhe", "#46505e");
    const matCorpo = material("matCorpo", "#e63b42");
    const matMembros = material("matMembros", "#a62a35");
    const matClarao = material("matClarao", "#ffbd25");
    matClarao.emissiveColor = new BABYLON.Color3(1, 0.7, 0.1);
    matClarao.disableLighting = true;

    const matKit = material("matKit", "#d6d6ce");
    matKit.specularColor = new BABYLON.Color3(0.07, 0.07, 0.07);
    const materiaisKitBranco = {};
    for (const face of ["frente", "tras", "lateral", "topo", "fundo"]) {
        const mat = new BABYLON.StandardMaterial("kitBranco_" + face, scene);
        mat.diffuseColor = new BABYLON.Color3(1, 1, 1);
        mat.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);
        mat.backFaceCulling = false;
        mat.diffuseTexture = new BABYLON.Texture(
            BASE_ARQUIVOS + "texturas/kit-branco-" + face + ".jpg",
            scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
            () => console.info("MAPONTES FPS: kit branco (" + face + ") carregado"),
            (erro) => console.warn("MAPONTES FPS: falha na textura do kit (" + face + "):", erro)
        );
        mat.diffuseTexture.vScale = -1;
        mat.diffuseTexture.vOffset = 1;
        if (face === "topo") {
            mat.emissiveColor = new BABYLON.Color3(0.32, 0.32, 0.32);
            mat.backFaceCulling = false;
        }
        materiaisKitBranco[face] = mat;
    }
    const matMunicao = material("matCaixaMunicao", "#424b2b");
    matMunicao.specularColor = new BABYLON.Color3(0.08, 0.08, 0.06);
    const matFaixaMunicao = material("matFaixaMunicao", "#333b24");
    const materiaisCaixaRealista = {};
    for (const face of ["frente", "tampa", "lateral"]) {
        const m = new BABYLON.StandardMaterial("municaoTextura_" + face, scene);
        m.diffuseColor = new BABYLON.Color3(1, 1, 1);
        m.specularColor = new BABYLON.Color3(0.05, 0.05, 0.04);
        m.backFaceCulling = false;
        m.diffuseTexture = new BABYLON.Texture(
            BASE_ARQUIVOS + "texturas/caixa-municao-" + face + ".jpg",
            scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
            () => console.info("MAPONTES FPS: textura da caixa (" + face + ") carregada"),
            (erro) => console.warn("MAPONTES FPS: textura da caixa indisponivel (" + face + "):", erro)
        );
        materiaisCaixaRealista[face] = m;
    }
    const matCruz = material("matCruz", "#ffffff");
    matCruz.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);

    const fragmentosImpacto = [];
    const poolFragmentos = [];
    function obterPedacoFragmento() {
        const reaproveitado = poolFragmentos.pop();
        if (reaproveitado && !reaproveitado.isDisposed()) {
            reaproveitado.setEnabled(true);
            return reaproveitado;
        }
        const novo = BABYLON.MeshBuilder.CreateBox("fragmentoTiro", { size: 1 }, scene);
        novo.isPickable = false;
        return novo;
    }
    function devolverPedacoFragmento(malha) {
        malha.setEnabled(false);
        poolFragmentos.push(malha);
    }
    const matParticulaMetal = material("particulaMetal", "#ffd88a");
    matParticulaMetal.emissiveColor = new BABYLON.Color3(0.35, 0.18, 0.04);
    const matParticulaRoupa = material("particulaRoupa", "#cbd5d8");
    function criarImpacto(posicao, normal, acertouInimigo) {
        if (!posicao) return;
        const quantidade = efeitosReduzidos ? (acertouInimigo ? 4 : 2) : (acertouInimigo ? 9 : 5);
        for (let i = 0; i < quantidade; i++) {
            const pedaco = obterPedacoFragmento();
            pedaco.scaling.setAll(0.035 + Math.random() * 0.055);
            pedaco.rotation.set(0, 0, 0);
            pedaco.position.copyFrom(posicao);
            pedaco.material = acertouInimigo ? matParticulaRoupa : matParticulaMetal;
            pedaco.isPickable = false;
            const vetor = new BABYLON.Vector3(
                (Math.random() - 0.5) * 3.2,
                0.5 + Math.random() * 2.8,
                (Math.random() - 0.5) * 3.2
            );
            if (normal) vetor.addInPlace(normal.scale(1.1));
            fragmentosImpacto.push({
                mesh: pedaco, velocidade: vetor,
                fim: tempo + 0.25 + Math.random() * 0.28
            });
        }
    }
    function atualizarFragmentos(dt) {
        for (let i = fragmentosImpacto.length - 1; i >= 0; i--) {
            const f = fragmentosImpacto[i];
            if (tempo >= f.fim) {
                devolverPedacoFragmento(f.mesh);
                fragmentosImpacto.splice(i, 1);
                continue;
            }
            f.velocidade.y -= 7.5 * dt;
            f.mesh.position.addInPlace(f.velocidade.scale(dt));
            f.mesh.rotation.x += 7 * dt;
            f.mesh.rotation.z += 5 * dt;
        }
    }

    const marcasBalas = [];
    const limiteMarcas = 36;
    const matMarcaMadeira = material("marcaBalaMadeira", "#21160f");
    const matMarcaConcreto = material("marcaBalaConcreto", "#222a30");
    for (const mat of [matMarcaMadeira, matMarcaConcreto]) {
        mat.disableLighting = true;
        mat.backFaceCulling = false;
    }
    const URL_MARCA_BALA = BASE_ARQUIVOS + "efeitos/marca-bala-concreto.png";
    const matMarcaRealista = new BABYLON.StandardMaterial("marcaBalaRealista28", scene);
    matMarcaRealista.disableLighting = true;
    matMarcaRealista.backFaceCulling = false;
    matMarcaRealista.useAlphaFromDiffuseTexture = true;
    matMarcaRealista.alpha = 1;
    matMarcaRealista.diffuseColor = BABYLON.Color3.White();
    matMarcaRealista.emissiveColor = new BABYLON.Color3(0.18, 0.18, 0.18);
    matMarcaRealista.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
    const texturaMarcaRealista = new BABYLON.Texture(URL_MARCA_BALA, scene, false, false,
        BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
        () => { marcaRealistaCarregada = true; console.info("MAPONTES FPS: marca de bala realista carregada"); },
        () => { console.warn("MAPONTES FPS: marca PNG indisponivel; usando marcas antigas"); matMarcaRealista.diffuseTexture = null; });
    texturaMarcaRealista.hasAlpha = true;
    matMarcaRealista.diffuseTexture = texturaMarcaRealista;
    let marcaRealistaCarregada = false;

    const matPoeiraMadeira = material("poeiraMadeira", "#ba8953");
    const matPoeiraConcreto = material("poeiraConcreto", "#a9afb4");
    const poeiraImpactos = [];
    function registrarImpactoCenario(ponto, normal, superficie) {
        if (!ponto || !superficie || !superficie.checkCollisions) return;
        const madeira = !!(superficie.metadata && superficie.metadata.ehConteiner);
        const direcao = normal && normal.lengthSquared() > 0.01
            ? normal.normalize() : new BABYLON.Vector3(0, 1, 0);
        const usarPNG = !madeira && marcaRealistaCarregada;
        const marca = usarPNG
            ? BABYLON.MeshBuilder.CreatePlane("marcaBalaRealista28", {
                size: 0.20 + Math.random() * 0.075,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
              }, scene)
            : BABYLON.MeshBuilder.CreateDisc("marcaBala28", {
                radius: 0.045 + Math.random() * 0.023, tessellation: 10,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
              }, scene);
        marca.position.copyFrom(ponto).addInPlace(direcao.scale(0.016));
        marca.lookAt(marca.position.add(direcao));
        if (usarPNG) marca.rotate(BABYLON.Axis.Z, Math.random() * Math.PI * 2, BABYLON.Space.LOCAL);
        marca.material = usarPNG ? matMarcaRealista : (madeira ? matMarcaMadeira : matMarcaConcreto);
        marca.isPickable = false;
        marcasBalas.push({ mesh: marca, fim: tempo + 12 });
        if (marcasBalas.length > limiteMarcas) marcasBalas.shift().mesh.dispose();
        for (let i = 0; i < 7; i++) {
            const po = BABYLON.MeshBuilder.CreateBox("poeiraTiro28", {
                size: 0.025 + Math.random() * 0.06
            }, scene);
            po.position.copyFrom(ponto);
            po.material = madeira ? matPoeiraMadeira : matPoeiraConcreto;
            po.isPickable = false;
            poeiraImpactos.push({
                mesh: po, fim: tempo + 0.3 + Math.random() * 0.35,
                vel: direcao.scale(0.8 + Math.random() * 1.7).add(new BABYLON.Vector3(
                    (Math.random() - 0.5) * 2, Math.random() * 1.7,
                    (Math.random() - 0.5) * 2))
            });
        }
    }
    function atualizarImpactosCenario(dt) {
        for (let i = marcasBalas.length - 1; i >= 0; i--) {
            if (tempo >= marcasBalas[i].fim) {
                marcasBalas[i].mesh.dispose(); marcasBalas.splice(i, 1);
            }
        }
        for (let i = poeiraImpactos.length - 1; i >= 0; i--) {
            const p = poeiraImpactos[i];
            if (tempo >= p.fim) { p.mesh.dispose(); poeiraImpactos.splice(i, 1); continue; }
            p.vel.y -= dt * 4;
            p.mesh.position.addInPlace(p.vel.scale(dt));
            p.mesh.rotation.y += dt * 6;
        }
    }
    function limparImpactosCenario() {
        for (const m of marcasBalas) m.mesh.dispose();
        for (const p of poeiraImpactos) p.mesh.dispose();
        marcasBalas.length = 0; poeiraImpactos.length = 0;
    }

    // O PhotoDome acima e o unico fundo panoramico. A antiga malha cilindrica
    // foi removida para evitar duas imagens sobrepostas e um horizonte duplicado.


    const chao = BABYLON.MeshBuilder.CreateGround(
        "chao", { width: 40, height: 40 }, scene
    );
    chao.material = matChao;
    chao.freezeWorldMatrix();

    const mapaBaseMeshes214 = [];
    function bloco(nome, x, z, l, a, p, mat) {
        const ehConteiner = mat === matCaixa;
        const alturaFinal = ehConteiner ? 2.2 : a;
        const larguraFinal = ehConteiner ? 2.2 : l;
        const comprimentoFinal = ehConteiner ? 4.4 : p;
        const mesh = BABYLON.MeshBuilder.CreateBox(
            nome,
            {
                width: ehConteiner ? comprimentoFinal : larguraFinal,
                height: alturaFinal,
                depth: ehConteiner ? larguraFinal : comprimentoFinal
            },
            scene
        );
        mesh.position.set(x, alturaFinal / 2, z);
        mesh.material = mat;
        mesh.checkCollisions = true;
        mapaBaseMeshes214.push(mesh);
        if (ehConteiner) {
            mesh.metadata = Object.assign({}, mesh.metadata, {
                ehConteiner: true, temBarreiraSolida: true
            });
            mesh.subMeshes = [];
            for (let face = 0; face < 6; face++) {
                new BABYLON.SubMesh(face, face * 4, 4, face * 6, 6, mesh);
            }
            // Colisor independente e um pouco maior que a malha texturizada:
            // mantém os contêineres sólidos mesmo se a textura tiver faces finas.
            const barreiraSolida = BABYLON.MeshBuilder.CreateBox(
                nome + "_barreiraSolida",
                {
                    width: comprimentoFinal + 0.12,
                    height: alturaFinal + 0.04,
                    depth: larguraFinal + 0.12
                },
                scene
            );
            barreiraSolida.position.copyFrom(mesh.position);
            barreiraSolida.checkCollisions = true;
            barreiraSolida.isPickable = false;
            barreiraSolida.visibility = 0;
            barreiraSolida.metadata = { ehConteiner: true, colisorSolidoConteiner: true };
            barreiraSolida.freezeWorldMatrix();
            mapaBaseMeshes214.push(barreiraSolida);
        }
        mesh.freezeWorldMatrix();
        return mesh;
    }

    bloco("caixa1", -4, 0, 2, 2, 2, matCaixa);
    bloco("caixa2", 4, 3, 2, 3, 2, matCaixa);
    bloco("caixa3", 0, 8, 3, 2, 2, matCaixa);
    bloco("coberturaE", -3, -7, 2.5, 2.2, 1.3, matCaixa);
    bloco("coberturaD", 3, -7, 2.5, 2.2, 1.3, matCaixa);

    bloco("barreiraBaixa", 0, -6, 2.8, 1.35, 0.6, matBarreira);

    const ALTURA_MURO_169 = 1.2; // libera a vista externa sem remover a barreira
    function muroTexturizado(nome, x, z, largura, altura, profundidade) {
        const repeticoesX = Math.max(1, largura / 6);
        const repeticoesZ = Math.max(1, profundidade / 6);

    function formaHUD(tipo, cor, tamanho = 64) {
        const area = new BABYLON.GUI.Rectangle("icone_" + tipo);
        area.width = tamanho + "px"; area.height = tamanho + "px";
        area.thickness = 0; area.background = "transparent";
        area.isHitTestVisible = false;
        function ret(x, y, w, h, preenchimento, raio = 2) {
            const f = new BABYLON.GUI.Rectangle();
            f.width = w + "px"; f.height = h + "px";
            f.left = x + "px"; f.top = y + "px";
            f.thickness = 0; f.cornerRadius = raio;
            f.background = preenchimento;
            area.addControl(f);
            return f;
        }
        function elipse(x, y, w, h, preenchimento) {
            const e = new BABYLON.GUI.Ellipse();
            e.width = w + "px"; e.height = h + "px";
            e.left = x + "px"; e.top = y + "px";
            e.thickness = 0; e.background = preenchimento;
            area.addControl(e);
        }
        if (tipo === "vida") {
            elipse(-6, -6, 17, 17, cor); elipse(6, -6, 17, 17, cor);
            const ponta = ret(0, 5, 18, 18, cor, 2);
            ponta.rotation = Math.PI / 4;
        } else if (tipo === "kit") {
            ret(0, 3, 27, 23, cor, 4);
            ret(0, -12, 13, 5, cor, 2);
            ret(0, 3, 17, 6, "#ffffff", 1);
            ret(0, 3, 6, 17, "#ffffff", 1);
        } else if (tipo === "arma") {
            ret(-1, -4, 28, 8, cor, 1);
            ret(11, -8, 8, 4, "#ffd78d", 0);
            ret(-3, 4, 6, 15, cor, 1).rotation = -0.25;
            ret(-10, 2, 6, 11, "#ffdc87", 1);
        } else if (tipo === "reserva") {
            for (let i = 0; i < 3; i++) {
                ret(-10 + i * 10, 3, 7, 19, cor, 2);
                ret(-10 + i * 10, -9, 7, 5, "#ffe8a8", 2);
            }
        } else if (tipo === "caixa" || tipo === "carregador" || tipo === "coleta") {
            ret(0, 3, 29, 23, cor, 3);
            ret(0, -7, 29, 5, "#c2eaff", 1);
            ret(0, 4, 5, 15, "#173a59", 1);
            ret(0, 4, 16, 5, "#173a59", 1);
        } else if (tipo === "uso") {
            ret(0, 0, 25, 9, cor, 2);
            ret(0, 0, 9, 25, cor, 2);
        } else if (tipo === "maleta") {
            ret(0, -3, 29, 20, "#667448", 4);
            ret(0, -12, 12, 7, "#b99b53", 2);
            ret(0, -7, 29, 4, "#cbb46c", 1);
            ret(0, -2, 5, 9, "#e6cb72", 1);
            ret(0, 4, 3, 3, "#584829", 1);
        } else if (tipo === "relogio") {
            elipse(0, 0, 26, 26, "#c8ad70");
            elipse(0, 0, 19, 19, "#f0e3bd");
            ret(0, -13, 7, 4, "#9b8350", 2);
            ret(-8, -11, 7, 4, "#9b8350", 2);
            ret(8, -11, 7, 4, "#9b8350", 2);
            ret(0, 0, 2, 9, "#3e3425", 1);
            ret(3, 1, 8, 2, "#3e3425", 1);
        } else if (tipo === "inventario") {
            ret(0, 0, 25, 28, cor, 4);
        }
        const arquivosIcones = {
            vida: "vida.png", kit: "kits.png", arma: "arma-ak47.png",
            reserva: "reserva.png", caixa: "caixas-municao.png",
            modo: "modo-disparo.png", carregador: "carregador.png",
            coleta: "balas-coletadas.png", uso: "kit-uso.png",
            inventario: "inventario.png"
        };
        const arquivoIcone = arquivosIcones[tipo];
        if (!arquivoIcone) return area;
        const urlIcone = BASE_ARQUIVOS + "icones/" + arquivoIcone + "?v=247";
        const imgHUD = new BABYLON.GUI.Image("realista_" + tipo, urlIcone);
        imgHUD.width = Math.max(1, tamanho - 1) + "px";

        imgHUD.stretch = BABYLON.GUI.Image.STRETCH_UNIFORM;
        imgHUD.isHitTestVisible = false;
        imgHUD.isVisible = false;
        if (imgHUD.onImageLoadedObservable &&

                }

        area.addControl(imgHUD);
        return area;

        const origem99 = new BABYLON.Vector3((min99.x + max99.x) * 0.5,
            (min99.y + max99.y) * 0.5 - 0.045 / escala99,

            const e117 = pose117.esquerda.subtract(origem99).scale(escala99);

            andar: !!posesConvertidas117.andar, corrida: posesConvertidas117.corrida.filter(Boolean).length
        });

        // encostada ao ombro direito do soldado.

        const modelos99 = [];

            for (let i99 = 0; i99 < peca99.pos.length; i99 += 3) {
                peca99.pos[i99] = (peca99.pos[i99] - origem99.x) * escala99;
                peca99.pos[i99 + 1] = (peca99.pos[i99 + 1] - origem99.y) * escala99;
                peca99.pos[i99 + 2] = (peca99.pos[i99 + 2] - origem99.z) * escala99;
            }
            const modelo99 = new BABYLON.Mesh("AK74M_FONTE_BOT99_" + peca99.nome, scene);
            const dados99 = new BABYLON.VertexData();
            dados99.positions = peca99.pos; dados99.indices = peca99.indices;
            dados99.uvs = peca99.uv;
            dados99.normals = [];
            BABYLON.VertexData.ComputeNormals(dados99.positions, dados99.indices, dados99.normals);
            dados99.applyToMesh(modelo99);
            modelo99.material = peca99.material;
            modelo99.isPickable = false;
            modelo99.setEnabled(false);
            modelos99.push(modelo99);
        }

            maoDireitaAK: maoDireitaAK99, maoEsquerdaAK: maoEsquerdaAK99,

    function animarModeloFab145(alvo145, instancia145) {

        let estado145 = "";

            if (novo145 === estado145) return;
            for (const grupo145 of grupos145) grupo145.stop();
            if (novo145 !== "morrendo") {
                const grupo145 = clipe145[novo145] || clipe145.idle;
                if (grupo145) {
                    grupo145.start(novo145 !== "knife");
                    grupo145.goToFrame(grupo145.from);
                }

            estado145 = novo145;
        };

            if (scene.isDisposed || alvo145.raiz.isDisposed()) return;

                trocar145("morrendo");
                anterior145.copyFrom(alvo145.raiz.position);
                return;
            }
            if (!alvo145.raiz.isEnabled()) {
                trocar145("idle");
                anterior145.copyFrom(alvo145.raiz.position);
                return;
            }
            const dt145 = Math.max(0.001, Math.min(0.1, engine.getDeltaTime() / 1000));
            const distancia145 = Math.hypot(
                alvo145.raiz.position.x - anterior145.x,
                alvo145.raiz.position.z - anterior145.z

            const velocidade145 = distancia145 / dt145;
            anterior145.copyFrom(alvo145.raiz.position);
            const piso145 = alturaPisoCache(alvo145,
                alvo145.raiz.position.x, alvo145.raiz.position.z);
            const noAr145 = (alvo145.alturaAtual ?? alvo145.raiz.position.y) > piso145 + 0.12 ||
                (alvo145.velocidadeVertical || 0) > 0.25;
            const andando145 = velocidade145 > 0.10;
            alvo145.correndoGLB = andando145 && velocidade145 > 1.6;
            const desejado145 = tempo < (alvo145.facadaAte145 || 0) ? "knife" :
                noAr145 ? "air" : !andando145 ? "idle" :
                    alvo145.correndoGLB ? "run" : "walk";
            trocar145(desejado145);

    function animarPernasGLB101(alvo101, instancia101) {
        const nodes101 = instancia101.rootNodes.flatMap((r101) => [r101, ...r101.getDescendants(false)]);
        const buscar101 = (nome101) => nodes101.find((n101) =>
            n101.name.includes("mixamorig:" + nome101 + "_"));
        const pernas101 = [
            { quadril: buscar101("LeftUpLeg"), joelho: buscar101("LeftLeg"), pe: buscar101("LeftFoot"), fase: 0 },
            { quadril: buscar101("RightUpLeg"), joelho: buscar101("RightLeg"), pe: buscar101("RightFoot"), fase: Math.PI }
        ];
        if (pernas101.some((p101) => !p101.quadril || !p101.joelho || !p101.pe)) {
            console.warn("MAPONTES FPS ETAPA 101: ossos das pernas indisponiveis", alvo101.indice);
            return;
        }
        const ossos101 = pernas101.flatMap((p101) => [p101.quadril, p101.joelho, p101.pe]);
        // ETAPA 124: calibrar a passada pelo comprimento real dos ossos do GLB.
        // Isso evita usar a mesma abertura e amplitude em modelos de proporcoes diferentes.
        alvo101.raiz.computeWorldMatrix(true);
        ossos101.forEach((n101) => n101.computeWorldMatrix(true));
        const inversaRaiz101 = alvo101.raiz.getWorldMatrix().clone().invert();
        const localOsso101 = (n101) => BABYLON.Vector3.TransformCoordinates(
            n101.getAbsolutePosition(), inversaRaiz101);
        const quadrisLocais101 = pernas101.map((p101) => localOsso101(p101.quadril));
        const medidasPernas101 = pernas101.map((p101) => ({
            coxa: BABYLON.Vector3.Distance(localOsso101(p101.quadril), localOsso101(p101.joelho)),
            canela: BABYLON.Vector3.Distance(localOsso101(p101.joelho), localOsso101(p101.pe))
        }));
        const alturaModelo101 = Math.max(0.1, alvo101.tamanhoGLB92?.altura || 1.7);
        const comprimentoMedio101 = medidasPernas101.reduce(
            (s101, m101) => s101 + m101.coxa + m101.canela, 0) / medidasPernas101.length;
        const fatorPasso101 = BABYLON.Scalar.Clamp(
            comprimentoMedio101 / (alturaModelo101 * 0.44), 0.78, 1.22);
        const larguraQuadris101 = Math.abs(quadrisLocais101[0].x - quadrisLocais101[1].x);
        const ajusteBase101 = Math.min(0.018, larguraQuadris101 * 0.04);
        alvo101.medidasAnimacaoGLB123 = {
            pernas: medidasPernas101, larguraQuadris: larguraQuadris101,
            fatorPasso: fatorPasso101
        };
        let bases101 = ossos101.map((n101) => n101.rotationQuaternion?.clone() ||
            BABYLON.Quaternion.FromEulerVector(n101.rotation));
        let posicoesBases101 = ossos101.map((n101) => n101.position.clone());
        const anterior101 = alvo101.raiz.position.clone();
        let fase101 = 0, intensidade101 = 0;
        // Remover somente a camada de caminhada aplicada no quadro anterior,
        // antes de avaliar novamente a animacao Idle original.
        const antes101 = scene.onBeforeAnimationsObservable.add(() => {
            ossos101.forEach((n101, i101) => {
                n101.rotationQuaternion = bases101[i101].clone();
                n101.position.copyFrom(posicoesBases101[i101]);
            });
        });
        const depois101 = scene.onAfterAnimationsObservable.add(() => {
            bases101 = ossos101.map((n101) => n101.rotationQuaternion.clone());
            posicoesBases101 = ossos101.map((n101) => n101.position.clone());
            const dt101 = Math.max(0.001, Math.min(0.1, engine.getDeltaTime() / 1000));
            const distancia101 = Math.hypot(alvo101.raiz.position.x - anterior101.x,
                alvo101.raiz.position.z - anterior101.z);
            anterior101.copyFrom(alvo101.raiz.position);
            const velocidade101 = distancia101 < 0.8 ? distancia101 / dt101 : 0;
            const andando101 = !alvo101.morrendo && velocidade101 > 0.05;
            const desejada101 = andando101 ? Math.min(1, velocidade101 / 1.2) : 0;
            intensidade101 += (desejada101 - intensidade101) * (1 - Math.exp(-12 * dt101));
            const correndo101 = andando101 && velocidade101 > 1.6;
            alvo101.correndoGLB = correndo101;
            if (andando101) fase101 += distancia101 * (correndo101 ? 3.0 : 3.5);
            // ETAPA 115: a oscilacao do braco livre usa a mesma fase da perna esquerda.
            alvo101.fasePassoGLB115 = fase101;
            alvo101.intensidadePassoGLB115 = intensidade101;
            pernas101.forEach((p101, i101) => {
                const fasePerna101 = fase101 + p101.fase;
                const passo101 = Math.sin(fasePerna101);
                const levantar101 = Math.max(0, -passo101);
                const impulsoCorrida101 = correndo101 ? 1.04 : 1;
                const angulos101 = [passo101 * 0.54 * impulsoCorrida101 * fatorPasso101,
                    -levantar101 * (correndo101 ? 1.35 : 1.30) * fatorPasso101,
                    (-passo101 * 0.22 + levantar101 * (correndo101 ? 0.36 : 0.30)) * fatorPasso101];
                // Ajuste lateral proporcional a distancia real entre os quadris do GLB.
                p101.quadril.position.x = posicoesBases101[i101 * 3].x +
                    (i101 === 0 ? -ajusteBase101 : ajusteBase101);
                [p101.quadril, p101.joelho, p101.pe].forEach((n101, j101) => {
                    n101.rotationQuaternion = bases101[i101 * 3 + j101].multiply(
                        BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X,
                            angulos101[j101] * intensidade101));
                    n101.computeWorldMatrix(true);
                });
            });
        });
        alvo101.modeloTatico87.onDisposeObservable.add(() => {
            scene.onBeforeAnimationsObservable.remove(antes101);
            scene.onAfterAnimationsObservable.remove(depois101);
        });
    }

            if (!toque188?.hit ||

                    const passoIA = Math.min(distanciaDestino, velocidadeMovimento * dtIA);
                    const proximoX = alvo.posX + deltaX / distanciaDestino * passoIA;
                    const proximoZ = alvo.posZ + deltaZ / distanciaDestino * passoIA;
                    const origemIA = origemMovimentoTmp.set(
                        alvo.posX, (alvo.alturaAtual ?? alvo.y) + 1, alvo.posZ);
                    direcaoMovimentoTmp.set(
                        proximoX - alvo.posX, 0, proximoZ - alvo.posZ).normalize();
                    raioMovimento.length = passoIA + 0.55;
                    const obstaculoIA = scene.pickWithRay(
                        raioMovimento, predicadoColisao, false
                    );
                    if (!obstaculoIA?.hit) {
                        alvo.posX = proximoX;
                        alvo.posZ = proximoZ;
                    } else if (buscandoCobertura) {
                        const lado = alvo.indice % 2 ? 1 : -1;
                        const sx = -deltaZ / distanciaDestino * lado;
                        const sz = deltaX / distanciaDestino * lado;
                        const raioLateral = new BABYLON.Ray(
                            origemIA, new BABYLON.Vector3(sx, 0, sz), 0.75
                        );
                        const bloqueioLateral = scene.pickWithRay(
                            raioLateral, mesh => mesh.checkCollisions && mesh.isEnabled(), false
                        );
                        if (!bloqueioLateral?.hit) {
                            alvo.posX += sx * velocidadeMovimento * dtIA;
                            alvo.posZ += sz * velocidadeMovimento * dtIA;
                        }
                    }
                }
            }
            if (!perseguindo && !buscandoCobertura) {
                const voltaX = alvo.x - alvo.posX;
                const voltaZ = alvo.z - alvo.posZ;
                const distanciaVolta = Math.hypot(voltaX, voltaZ);
                if (distanciaVolta > 0.03) {
                    const passoVolta = Math.min(distanciaVolta, 1.1 * dtIA);
                    alvo.posX += voltaX / distanciaVolta * passoVolta;
                    alvo.posZ += voltaZ / distanciaVolta * passoVolta;
                }
            }
            const patrulha = (perseguindo || buscandoCobertura) ? 0 : Math.sin(tempo * alvo.velocidade + alvo.fase) * 1.5;
            alvo.raiz.position.set(
                alvo.posX + patrulha + desvioLateral,
                alvo.alturaAtual ?? alvo.y,
                alvo.posZ
            );
            const pisoIA = alturaPisoCache(alvo, alvo.raiz.position.x, alvo.raiz.position.z);
            let bloqueioParaSalto = false;
            if (mover && !atordoado) {
                const vx = destinoX - alvo.posX;
                const vz = destinoZ - alvo.posZ;
                const comprimento = Math.hypot(vx, vz);
                if (comprimento > 0.15) {
                    if (tempo >= (alvo.proximaChecagemSalto || 0)) {
                        direcaoSaltoTmp.set(vx / comprimento, 0, vz / comprimento);
                        origemSaltoTmp.set(alvo.posX, pisoIA + 0.65, alvo.posZ);
                        const achou = scene.pickWithRay(raioSalto, predicadoSalto, false);
                        alvo.bloqueioSaltoCache = !!achou?.hit;
                        alvo.bloqueioConteinerSaltoCache = !!achou?.pickedMesh?.metadata?.ehConteiner;
                        alvo.proximaChecagemSalto = tempo + 0.1;
                    }
                    // Contêineres são obstáculos altos: a IA deve contorná-los,
                    // sem usar o salto como atalho para subir na parte superior.
                    bloqueioParaSalto = !!alvo.bloqueioSaltoCache &&
                        !alvo.bloqueioConteinerSaltoCache;
                }
            }
            if (bloqueioParaSalto && !alvo.preparando && !alvo.recarregandoArma &&
                tempo >= (alvo.proximoSalto || 0) &&
                Math.abs((alvo.alturaAtual ?? alvo.y) - pisoIA) < 0.035 &&
                Math.abs(alvo.velocidadeVertical || 0) < 0.01) {
                alvo.velocidadeVertical = 6.8;
                alvo.proximoSalto = tempo + 2.0;
            }
            atualizarAlturaInimigo(alvo, dtIA, pisoIA);

            for (const outro of alvos) {
                if (outro === alvo || !outro.raiz.isEnabled() || outro.morrendo) continue;
                const ox = alvo.raiz.position.x - outro.raiz.position.x;
                const oz = alvo.raiz.position.z - outro.raiz.position.z;
                const d = Math.hypot(ox, oz);
                const minimo = 1.05;
                if (d < minimo) {
                    const ang = d > 0.001 ? { x: ox / d, z: oz / d } :
                        { x: Math.cos(alvo.indice * 2.4), z: Math.sin(alvo.indice * 2.4) };
                    alvo.raiz.position.x += ang.x * (minimo - d);
                    alvo.raiz.position.z += ang.z * (minimo - d);
                }
            }
            const px = alvo.raiz.position.x - camera.position.x;
            const pz = alvo.raiz.position.z - camera.position.z;
            const distPlayer = Math.hypot(px, pz);
            if (distPlayer < 0.9) {
                const d = Math.max(0.001, distPlayer);
                alvo.raiz.position.x += (px / d) * (0.9 - d);
                alvo.raiz.position.z += (pz / d) * (0.9 - d);
            }
            const movX = alvo.raiz.position.x - alvo.ultimoX;
            const movZ = alvo.raiz.position.z - alvo.ultimoZ;
            if (movX * movX + movZ * movZ > 0.0000005) {
                const angulo = Math.atan2(movX, movZ);
                const diferenca = Math.atan2(
                    Math.sin(angulo - alvo.raiz.rotation.y),
                    Math.cos(angulo - alvo.raiz.rotation.y)
                );
                const fatorGiro = 1 - Math.exp(-9 * dtIA);
                alvo.raiz.rotation.y += diferenca * fatorGiro;
            }
            if (alvo.preparando || (alvo.atacanteMelee145 && perseguindo)) {
                const vetorAlvo = camera.position.subtract(alvo.raiz.position);
                const anguloMira = Math.atan2(vetorAlvo.x, vetorAlvo.z);
                const diferencaMira = Math.atan2(
                    Math.sin(anguloMira - alvo.raiz.rotation.y),
                    Math.cos(anguloMira - alvo.raiz.rotation.y)
                );
                alvo.raiz.rotation.y += diferencaMira * (1 - Math.exp(-11 * dtIA));
            }
            const origemCano = alvo.suporteArma.getAbsolutePosition();
            const distHorizontal = Math.hypot(
                camera.position.x - origemCano.x,
                camera.position.z - origemCano.z
            );
            const anguloVertical = -Math.atan2(
                camera.position.y - origemCano.y, Math.max(0.01, distHorizontal)
            );
            const tRecuoElevacao = tempo - alvo.recuoInicio;
            const recuoElevacao = tRecuoElevacao >= 0 && tRecuoElevacao < 0.24
                ? Math.exp(-tRecuoElevacao * 13) * Math.sin(Math.PI * tRecuoElevacao / 0.24) * 0.17
                : 0;
            const alvoElevacao = (alvo.preparando ? anguloVertical : 0) - recuoElevacao;
            alvo.suporteArma.rotation.x +=
                (alvoElevacao - alvo.suporteArma.rotation.x) * (1 - Math.exp(-10 * dtIA));
            alvo.ultimoX = alvo.raiz.position.x;
            alvo.ultimoZ = alvo.raiz.position.z;

            if (alvo.barraVida.isVisible && tempo >= alvo.mostrarVidaAte) {
                alvo.barraVida.isVisible = false;
            }

            const distanciaFrame = Math.hypot(movX, movZ);
            const velocidadeVisual = Math.min(3.2, distanciaFrame / Math.max(0.008, dtIA));
            const andando = velocidadeVisual > 0.07;
            alvo.correndoGLB = andando && velocidadeVisual > 1.6;
            alvo.fasePasso = (alvo.fasePasso || 0) +
                dtIA * (andando ? 4.2 + velocidadeVisual * 1.4 : 0);
            if (andando && tempo >= (alvo.proximoSomPasso || 0)) {
                somPasso(alvo.raiz.position, velocidadeVisual > 1.6);
                alvo.proximoSomPasso = tempo + (velocidadeVisual > 1.6 ? 0.43 : 0.55);
            }
            if (andando && velocidadeVisual > 1.3 && tempo >= alvo.proximaPoeira) {
                criarPoeira(alvo);
                alvo.proximaPoeira = tempo + 0.22;
            }
            alvo.raiz.position.y = (alvo.alturaAtual ?? alvo.y) + (andando ?
                Math.abs(Math.sin(alvo.fasePasso + alvo.fase)) * 0.025 : 0);
            const progressoRecarga = !alvo.atacanteMelee145 && alvo.recarregandoArma
                ? Math.max(0, Math.min(1, 1 - (alvo.recargaAte - tempo) / 2.1)) : 0;
            const destaqueRecarga = Math.sin(progressoRecarga * Math.PI);
            const duracaoReacao = alvo.classe.nome === "Pesado" ? 0.22 : 0.38;
            const progressoReacao = Math.max(0, Math.min(1,
                (tempo - alvo.reacaoInicio) / duracaoReacao));
            const ondaReacao = tempo < alvo.reacaoAte ?
                Math.sin(progressoReacao * Math.PI) * alvo.reacaoForca : 0;
            alvo.raiz.rotation.x = -ondaReacao * 0.16;
            const inclinacaoLateral = ondaReacao * alvo.reacaoLado * 0.12;
            alvo.raiz.rotation.z = inclinacaoLateral;
            const extensaoDesejada = !alvo.atacanteMelee145 && alvo.preparando && !alvo.recarregandoArma ? 1 : 0;
            alvo.extensaoDisparo = BABYLON.Scalar.Lerp(
                alvo.extensaoDisparo || 0, extensaoDesejada,
                1 - Math.exp(-11 * dtIA));
            const tRecuo = tempo - alvo.recuoInicio;
            const recuo = tRecuo >= 0 && tRecuo < 0.24
                ? Math.exp(-tRecuo * 15) * Math.sin(Math.PI * Math.min(1, tRecuo / 0.24))
                : 0;
            alvo.suporteArma.position.z = 0.12 + alvo.extensaoDisparo * 0.64 - recuo * 0.20;
            alvo.suporteArma.position.x = 0.17 + alvo.extensaoDisparo * 0.02;
            alvo.suporteArma.rotation.z = destaqueRecarga * 0.85 + recuo * 0.055;
            alvo.suporteArma.rotation.y = destaqueRecarga * 0.35;
            alvo.suporteArma.position.y = 1.32 + alvo.extensaoDisparo * 0.47 - destaqueRecarga * 0.35 + recuo * 0.07;

            alvo.raiz.computeWorldMatrix(true);
            alvo.suporteArma.computeWorldMatrix(true);
        });
    }

            return {

                tamanho: largura + "x" + altura,
                MB_GPU_aprox: Math.round(largura * altura * 4 * 1.33 / 1048576 * 10) / 10
            };
        }).sort((a, b) => b.MB_GPU_aprox - a.MB_GPU_aprox);
        const totalMB = Math.round(texturas.reduce((n, t) => n + t.MB_GPU_aprox, 0));

            "CPU: render (ms)": ms(instrumentacaoCena.renderTimeCounter),
            "CPU: avaliar malhas (ms)": ms(instrumentacaoCena.activeMeshesEvaluationTimeCounter),
            "CPU: animacoes (ms)": ms(instrumentacaoCena.animationsTimeCounter),
            "GPU: quadro (ms)": gpuNs ? Math.round(gpuNs / 1e4) / 100 : "indisponivel neste navegador",
            "intervalo entre quadros (ms)": ms(instrumentacaoCena.interFrameTimeCounter),
            malhasTotais: scene.meshes.length,
            malhasDesenhadas: scene.getActiveMeshes().length,
            verticesTotais: scene.getTotalVertices(),
            chamadasDeDesenho: engine._drawCalls ? engine._drawCalls.current : "n/d",
            esqueletos: scene.skeletons.length,
            animacoesTocando: scene.animationGroups.filter((g) => g.isPlaying).length,
            morphTargets: scene.morphTargetManagers.reduce((n, m) => n + m.numTargets, 0),
            materiais: scene.materials.length,
            texturas: scene.textures.length,
            "texturas na GPU (MB aprox.)": totalMB
        };
        console.info("MAPONTES FPS: DIAGNOSTICO DE DESEMPENHO", resumo);
        console.info("MAPONTES FPS: 12 maiores texturas");
        console.table(texturas.slice(0, 12));
        instrumentacaoCena.dispose();
        instrumentacaoCena = null;
        if (instrumentacaoMotor) { instrumentacaoMotor.dispose(); instrumentacaoMotor = null; }

        const agora = audio.currentTime;

        const buffer = audio.createBuffer(1, tamanho, audio.sampleRate);

        volume.gain.setValueAtTime(Math.max(0.0001, ganho * ganhoCategoria(categoria)), agora);
        volume.gain.exponentialRampToValueAtTime(0.001, agora + duracao);

            const dx = posicao.x - camera.position.x;

            if (audio.createStereoPanner) {
                const pan = audio.createStereoPanner();
                const direita = new BABYLON.Vector3(Math.cos(camera.rotation.y), 0,

                pan.pan.value = BABYLON.Scalar.Clamp((dx * direita.x + dz * direita.z) /
                    Math.max(1, distancia), -0.85, 0.85);
                volume.connect(pan);
                pan.connect(atenuacao);
                fonte.onended = () => { fonte.disconnect(); filtro.disconnect();

            volume.connect(audio.destination);

    function somPasso(posicao = null, forte = false, furtivo = false) {

                        Math.max(1, distancia), -0.85, 0.85);

    // Versao leve de linhaDeTiro: so responde "ha linha livre ate o jogador?".
    function visaoLivreRapida(alvo) {
        origemVisaoTmp.copyFrom(alvo.raiz.position);
        origemVisaoTmp.y += 1.7;
        camera.position.subtractToRef(origemVisaoTmp, vetorVisaoTmp);
        const distancia = vetorVisaoTmp.length();

        vetorVisaoTmp.scaleInPlace(1 / distancia);
        raioVisao.length = distancia;

    // A percepcao da IA roda a ~10 Hz por inimigo, escalonada pelo indice.

    function linhaDeTiro(alvo) {
        const origem = alvo.raiz.position.add(new BABYLON.Vector3(0, 1.7, 0));
        const vetor = camera.position.subtract(origem);
        const distancia = vetor.length();
        if (distancia < 0.01 || distancia > 35) return null;
        const raio = new BABYLON.Ray(origem, vetor.scale(1 / distancia), distancia);
        const bloqueio = scene.pickWithRay(
            raio,
            mesh => mesh.isEnabled() && mesh.isPickable &&
                (mesh.checkCollisions ||
                    (mesh.metadata?.bloqueioInimigo !== undefined &&
                     mesh.metadata.bloqueioInimigo !== alvo.indice &&
                     !alvos[mesh.metadata.bloqueioInimigo].morrendo)),
            false
        );
        return {
            origem,
            destino: bloqueio?.hit ? bloqueio.pickedPoint.clone() : camera.position.clone(),
            livre: !bloqueio?.hit

    // O disparo segue o eixo real do cano (+Z da AK). Só conta como acerto

    function avaliarMiraDoInimigo(alvo) {
        const cano = alvo.canoAK99;
        const suporte = alvo.suporteArma;
        if (!cano || cano.isDisposed?.() || !suporte || suporte.isDisposed?.()) return null;
        suporte.computeWorldMatrix(true);
        cano.computeWorldMatrix(true);
        const origem = cano.getAbsolutePosition().clone();
        const direcao = cano.getDirection(BABYLON.Axis.Z).normalize();
        const ateJogador = camera.position.subtract(origem);
        const projecao = BABYLON.Vector3.Dot(ateJogador, direcao);
        if (projecao <= 0.05 || projecao > 35) return null;
        const desvioLateral = ateJogador.subtract(direcao.scale(projecao)).length();
        const pontoAlvo = origem.add(direcao.scale(projecao));
        const raio = new BABYLON.Ray(origem, direcao, projecao);
        indiceVisaoAtual = alvo.indice;
        const bloqueio = scene.pickWithRay(raio, predicadoVisao, false);
        const caminhoLivre = !bloqueio?.hit ||
            (bloqueio.distance >= projecao - 0.08);
        return {
            origem,
            direcao,
            ponto: bloqueio?.hit && !caminhoLivre ? bloqueio.pickedPoint.clone() : pontoAlvo,
            alinhado: desvioLateral <= 0.48,
            caminhoLivre
        };

    function atualizarAtaques() {

                alvo.raiz.rotation.x = 0;
                alvo.raiz.rotation.z = 0;
                alvo.coberturaAte = 0;
                alvo.morteInicio = tempo;
                // Alternar entre frente, tras, esquerda e direita.
                const direcao114 = Math.floor(Math.random() * 4);
                alvo.morteEixo114 = direcao114 < 2 ? "z" : "x";
                alvo.morteSentido114 = (direcao114 % 2 === 0) ? 1 : -1;
                alvo.reapareceEm = tempo + 3.025;
                alvo.colisaoCorpo.isPickable = false;
                alvo.preparando = false;
                alvo.recarregandoArma = false;
            }
            atualizarBarraVida(alvo);

            const nomeZona = {
                cabeca: "CABEÇA", tronco: "TRONCO",
                braco: "BRAÇO", perna: "PERNA"
            }[zona] || "CORPO";
            mostrarFeedback(
                eliminado
                    ? `ELIMINADO! +${ganho} PONTOS | ${bonus}x`
                    : `${naCabeca ? "HEADSHOT! " : ""}${nomeZona}: -${dano} HP | +${ganho}`,
                eliminado ? "#64ff92" : corAcerto
            );
            somCurto(eliminado ? 1050 : naCabeca ? 1400 : 820, 0.1, 0.06);
        } else {
            mostrarFeedback(
                sequencia > 0 ? "SEQUÊNCIA INTERROMPIDA" : "ERROU",
                "#ffb454"
            );
            sequencia = 0;
        }

        atualizarInterface();
    }

    function recarregar() {
        if (!estaAtivo() || recarregando || curando || balas === capacidade) return;
        if (balasReserva <= 0) {
            mostrarFeedback("SEM MUNIÇÃO NA RESERVA", "#ffb454");
            return;
        }
        recarregando = true;
        fimRecarga = tempo + tempoRecarga;
        animacaoEspecialAK("recarga", tempoRecarga);
        efeitoAte = 0;
        fimFlashAK = -999;
        clarao.setEnabled(false);
        flash60.style.display = "none";
        if (!tocarRecargaReal(null, tempoRecarga)) somCurto(240, 0.1, 0.06);
        atualizarInterface();
    }

    const capturarMouse = () => {
        iniciarAudio();
        if (!iniciado || menuInicialAberto || inicioEmAndamento || painelAudioAberto ||
            transicaoMissao216 || derrotaCidade216) return;
        if (document.pointerLockElement !== canvas) {
            const pedido = canvas.requestPointerLock();
            if (pedido && pedido.catch) pedido.catch(() => {});
        }
    };

    const mudouCaptura = () => {
        camera.detachControl();
        limparControles();
        if (document.pointerLockElement === canvas) {
            const iniciouPeloMenu217 = inicioEmAndamento;
            if (iniciouPeloMenu217 && mapaEscolhido217 === 2) {
                prepararCidadeAbandonada214();
            }
            iniciado = true;
            menuInicialAberto = false;
            inicioEmAndamento = false;
            telaAbertura.isVisible = false;
            if (!terminou && !transicaoMissao216 && !derrotaCidade216) camera.attachControl(canvas, true);
        } else if (iniciado && !terminou && !transicaoMissao216 && !derrotaCidade216 &&
            !painelAudioAberto && !menuInicialAberto) {
            mostrarMenuPausa192();
        }
        atualizarInterface();
        atualizarMusicaFundo();
    };

    const pressionarMouse = (evento) => {
        if (!estaAtivo() || painelAudioAberto) return;
        if (evento.button === 2) {
            if (!mirando) nivelZoom = 1;
            mirando = true;
            evento.preventDefault();
        }
        if (evento.button === 0) {
            if (!gatilhoPressionado) {
                gatilhoPressionado = true;
                atirar();
            }
            evento.preventDefault();
        }
    };

    const soltarMouse = (evento) => {
        if (evento.button === 2) mirando = false;
        if (evento.button === 0) gatilhoPressionado = false;
    };

    const bloquearMenu = (evento) => evento.preventDefault();

    const controlarZoomRoda = (evento) => {
        if (!estaMirando() || painelAudioAberto) return;
        evento.preventDefault();
        if (evento.deltaY < 0) nivelZoom = Math.min(3, nivelZoom + 1);
        else if (evento.deltaY > 0) nivelZoom = Math.max(1, nivelZoom - 1);
        atualizarInterface();
    };

    // Ignora o teclado do jogo quando a pessoa digita em campos da pagina
    // (janela de salvar, editor de codigo, etc.), mesmo com o jogo pausado.
    function teclaEmCampoDeTexto(evento) {
        if (digitandoNome198) return true;
        const origem = (evento.composedPath && evento.composedPath()[0]) || evento.target;
        if (!origem || origem === canvas || origem === document.body ||
            origem === document.documentElement) return false;
        if (origem.isContentEditable) return true;
        const tag = origem.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        return !!(origem.closest &&
            origem.closest(".monaco-editor, [role='textbox'], [contenteditable='true']"));
    }

    const pressionarTecla = (evento) => {
        if (teclaEmCampoDeTexto(evento)) return;
        if (transicaoMissao216 || derrotaCidade216) {
            evento.preventDefault();
            return;
        }
        if (confirmacaoInicio211.isVisible) {
            evento.preventDefault();
            return;
        }
        if ((menuInicialAberto && !painelAudioAberto) || inicioEmAndamento) return;
        if (evento.code === "KeyI" && !evento.repeat) {
            evento.preventDefault();
            inventarioAberto = !inventarioAberto;
            inventarioPainel.isVisible = inventarioAberto;
            atualizarInventario();
            return;
        }
        if (evento.code === "KeyM" && !evento.repeat) {
            evento.preventDefault();
            alternarPainelAudio();
            return;
        }
        if (evento.code === "KeyF" && painelAudioAberto && !evento.repeat) {
            evento.preventDefault();
            alternarPainelAudio();
            return;
        }
        if (evento.code === "KeyN" && !evento.repeat) {
            evento.preventDefault();
            alternarModoDesempenho();
            return;
        }
        if (document.pointerLockElement !== canvas || painelAudioAberto) return;
        teclas.add(evento.code);
        if (evento.repeat) return;

        if (evento.code === "Space" && estaAtivo()) {
            evento.preventDefault();
            if (saltoJogadorY <= 0.001 && velocidadeSaltoJogador <= 0 && !agachamentoAtivo) {
                velocidadeSaltoJogador = forcaSaltoJogador;
            }
        }
        if (evento.code === "KeyB" && estaAtivo()) {
            evento.preventDefault();
            modoDisparo = modoDisparo === "AUTO" ? "SEMI" : "AUTO";
            gatilhoPressionado = false;
            atualizarInterface();
        }
        if (evento.code === "KeyC" && estaAtivo()) {
            evento.preventDefault();
            agachamentoAtivo = !agachamentoAtivo;
        }
        if (evento.code === "KeyH") {
            evento.preventDefault();
            usarKitVida();
        }
        if (evento.code === "KeyR") {
            evento.preventDefault();
            recarregar();
        }
        if (evento.code === "KeyT" && estaAtivo()) {
            evento.preventDefault();
            usarDespertador179();
        }
        if (evento.code === "Enter") {
            evento.preventDefault();
            reiniciar();
        }
    };

    const bloquearEscapePainelAudio210 = (evento) => {
        if ((evento.code !== "Escape" && evento.key !== "Escape") ||
            !painelAudioAberto) return;
        // O ESC e ignorado neste painel; apenas M ou o botao FECHAR o encerram.
        evento.preventDefault();
        evento.stopPropagation();
        if (evento.stopImmediatePropagation) evento.stopImmediatePropagation();
    };

    const soltarTecla = (evento) => teclas.delete(evento.code);

    function pausar() {
        if (transicaoMissao216 || derrotaCidade216) return;
        musicaFundo.pause();
        pararRespiracao();
        pararBatimentos();
        limparControles();
        if (document.pointerLockElement === canvas) {
            document.exitPointerLock();
        }
        mostrarMenuPausa192();
    }

    const mudouVisibilidade = () => {
        if (document.hidden) pausar();
    };

    scene.onBeforeRenderObservable.add(() => {
        if (transicaoMissao216) {
            const restanteMissao216 = Math.max(0, fimTransicaoMissao216 - Date.now());
            contadorTransicaoMissao216.text = String(Math.ceil(restanteMissao216 / 1000));
            if (restanteMissao216 <= 0) {
                transicaoMissao216 = false;
                painelTransicaoMissao216.isVisible = false;
                prepararCidadeAbandonada214();
                if (document.pointerLockElement === canvas) {
                    camera.attachControl(canvas, true);
                } else {
                    mostrarMenuPausa192();
                }
                atualizarMusicaFundo();
            }
            return;
        }
        if (derrotaCidade216) return;
        atualizarMusicaFundo();
        if (!estaAtivo() || painelAudioAberto) {
            pararRespiracao();
            pararBatimentos();
            camera.cameraDirection.set(0, 0, 0);
            camera.cameraRotation.set(0, 0);
            intensidadePassoCamera127 = 0;
            camera.position.y = alturaAtual + saltoJogadorY;
            clarao.setEnabled(false);
        flash60.style.display = "none";
            for (const inimigo of alvos) inimigo.flashInimigo.setEnabled(false);
            return;
        }

        const dt = Math.min(0.05, engine.getDeltaTime() / 1000);
        const suavidade = 1 - Math.exp(-14 * dt);

        const agachado = estaAgachado();
        const alturaDesejada = agachado ? alturaAgachado : alturaEmPe;
        alturaAtual += (alturaDesejada - alturaAtual) * suavidade;
        if (velocidadeSaltoJogador !== 0 || saltoJogadorY > 0) {
            saltoJogadorY += velocidadeSaltoJogador * dt;
            velocidadeSaltoJogador -= gravidadeSaltoJogador * dt;
            if (saltoJogadorY <= 0) {
                saltoJogadorY = 0;
                velocidadeSaltoJogador = 0;
            }
        }
        const correndoJogador126 = estaCorrendo() && saltoJogadorY < 0.04;
        const intensidadeDesejada126 = correndoJogador126 ? 1 : 0;
        intensidadePassoCamera127 += (intensidadeDesejada126 - intensidadePassoCamera127) *
            (1 - Math.exp(-10 * dt));
        if (correndoJogador126) {
            // Balanço vertical de 5 cm para ficar perceptível sem atrapalhar a mira.
            // Um ciclo completo acompanha o ritmo dos passos.
            fasePassoCamera127 += dt * (Math.PI * 2 / 0.58);
        }
        const balancoVertical127 = Math.sin(fasePassoCamera127) * 0.05 * intensidadePassoCamera127;
        camera.position.y = alturaAtual + saltoJogadorY + balancoVertical127;

        camera.ellipsoid.y = agachado ? 0.5 : 0.8;

        tempo = Math.min(duracao, tempo + dt);
        if (modoDisparo === "AUTO" && gatilhoPressionado && !recarregando && !curando) atirar();
        impulsoRecuo = Math.max(0, impulsoRecuo - dt * 4.8);
        const caminhandoJogador = TECLAS_MOVIMENTO.some(t => teclas.has(t));
        if (caminhandoJogador && tempo >= audioPassos.jogador) {
            if (audio && audio.state === "suspended") audio.resume().catch(() => {});
            const correndoAgora = estaCorrendo();
            somPasso(null, correndoAgora, agachado);
            audioPassos.jogador = tempo + (agachado ? 0.72 : correndoAgora ? 0.29 : 0.46);
        }
        atualizarFragmentos(dt);
        atualizarImpactosCenario(dt);
        atualizarSupressao();
        atualizarPoeira(dt);

        if (tempo >= duracao) {
            finalizar(false);
            return;
        }

        atualizarAlvos();
        atualizarVisibilidadeBarras();
        atualizarKits();
        atualizarCaixasMunicao();
        atualizarRelogioTempo179();
        atualizarInventario();
        atualizarObjetivoRecuperacao171(dt);
        if (terminou) return;
        atualizarAtaques();
        if (terminou) return;

        for (let i = rastros.length - 1; i >= 0; i--) {
            if (tempo >= rastros[i].ate) {
                rastros[i].mesh.dispose();
                rastros.splice(i, 1);
            }
        }

        bordaDano.alpha = Math.max(0, (danoAte - tempo) / 0.35);
        atualizarEfeitoDano(dt);
        atualizarVidaCritica(dt);

        if (curando && tempo >= fimCura) {
            curando = false;
            const recuperado = Math.min(30, 100 - vida);
            vida += recuperado;
            vidaRecuperada += recuperado;
            mostrarFeedback(`+${recuperado} DE VIDA | KITS: ${kitsGuardados}`, "#64ff92");
            somCurto(1040, 0.2, 0.07);
            atualizarInventario();
        }

        if (recarregando && tempo >= fimRecarga) {
            recarregando = false;
            const faltam = capacidade - balas;
            const transferidas = Math.min(faltam, balasReserva);
            balas += transferidas;
            balasReserva -= transferidas;
            if (!audioRecargaBuffer) somCurto(460, 0.08, 0.06);
        }

        const miraAtiva = estaMirando();
        const corrida = estaCorrendo();
        const dimensaoLuneta = Math.round(Math.min(engine.getRenderWidth(), engine.getRenderHeight()) * escalaUI * 0.90);
        if (luneta3xPNG.width !== dimensaoLuneta + "px") {
            luneta3xPNG.width = dimensaoLuneta + "px";
            luneta3xPNG.height = dimensaoLuneta + "px";
        }

        camera.speed = agachado
            ? (miraAtiva ? 0.1 : 0.14)
            : miraAtiva ? 0.17
            : corrida ? velocidadeCorrida : 0.35;

        camera.angularSensibility = miraAtiva ? 4200 : 2500;

        const fovDesejado = miraAtiva ? 0.82 / nivelZoom : corrida ? (65 * Math.PI / 180) : (60 * Math.PI / 180);
        camera.fov += (fovDesejado - camera.fov) * suavidade;

        const recuo = Math.max(0, (efeitoAte - tempo) / 0.09);
        const recuoArma = impulsoRecuo * (miraAtiva ? 0.035 : 0.055);
        const oscilacaoRecuo = Math.sin(faseRecuo * 2.4) * impulsoRecuo * 0.012;
        const xDesejado = miraAtiva ? 0.47 : 0.47; // enquadramento referencia: arma no quadrante inferior direito
        let yDesejado = miraAtiva ? -0.58 : -0.58; // deixa o ombro e a manga fora do centro da tela
        const zDesejado = miraAtiva ? 0.60 : 0.60; // profundidade da referencia
        let rotacaoDesejada = 0;

        if (corrida) {
            yDesejado -= 0.08;
            rotacaoDesejada = 0.15;
        }

        if (curando) {
            const progressoCura = Math.max(0, Math.min(1, 1 - (fimCura - tempo) / duracaoCura));
            const gestoCura = Math.sin(progressoCura * Math.PI);
            yDesejado -= 0.24 * gestoCura;
            rotacaoDesejada = -0.28 * gestoCura;
        }
        if (recarregando) {
            const progresso = 1 - (fimRecarga - tempo) / tempoRecarga;
            const movimento = Math.sin(progresso * Math.PI);
            yDesejado -= movimento * 0.3;
            rotacaoDesejada = movimento * 0.5;
        }

        arma.position.x += (xDesejado + oscilacaoRecuo - arma.position.x) * suavidade;
        arma.position.y += (yDesejado - arma.position.y) * suavidade;
        arma.position.z = zDesejado - recuo * 0.08 - recuoArma;
        arma.rotation.x +=
            (rotacaoDesejada + impulsoRecuo * 0.09 - arma.rotation.x) * suavidade;
        atualizarAnimacaoAK(corrida, miraAtiva);
        if (ak74Estado.pronto && ak74Estado.raiz) {
            ak74Estado.raiz.setEnabled(!miraAtiva);
        }

        atualizarInterface();
    });

    let ultimoDiagnosticoAudio = 0;
    function ativarAudioPorInteracao() {
        if (cenaEncerrada) return;
        try {
            iniciarAudio(); // inicia os 18 downloads uma unica vez por cena
            musicaLiberada = true;
            atualizarMusicaFundo();
            if (audio && audio.state === "suspended") {
                audio.resume().then(() => {
                    if (!cenaEncerrada) console.info("MAPONTES FPS: audio liberado pelo usuario:", audio.state);
                }).catch(erro => console.warn("MAPONTES FPS: desbloqueio de audio:", erro));
            }
            const agora = Date.now();
            if (agora - ultimoDiagnosticoAudio > 4000) {
                ultimoDiagnosticoAudio = agora;
                console.info("MAPONTES FPS: diagnostico audio", {
                    contexto: audio ? audio.state : "indisponivel",
                    sons: sonsFinalizados.size + "/" + totalSonsPersonalizados,
                    falhas: [...sonsComFalha]
                });
            }
        } catch (erro) {
            console.error("MAPONTES FPS: erro ao inicializar sons:", erro);
            detalheCarregamentoSons.text = "Falha ao iniciar audio (F12)";
        }
    }
    canvas.addEventListener("pointerdown", ativarAudioPorInteracao);
    const ativarAudioTeclado = (evento) => {
        if (teclaEmCampoDeTexto(evento)) return;
        ativarAudioPorInteracao();
    };
    window.addEventListener("keydown", ativarAudioTeclado);
    canvas.addEventListener("click", capturarMouse);
    canvas.addEventListener("mousedown", pressionarMouse);
    canvas.addEventListener("contextmenu", bloquearMenu);
    canvas.addEventListener("wheel", controlarZoomRoda, { passive: false });
    window.addEventListener("mouseup", soltarMouse);
    window.addEventListener("keydown", bloquearEscapePainelAudio210, true);
    window.addEventListener("keydown", pressionarTecla);
    window.addEventListener("keyup", soltarTecla);
    window.addEventListener("blur", pausar);
    const cancelarGatilho = () => { gatilhoPressionado = false; };
    canvas.addEventListener("mouseleave", cancelarGatilho);
    document.addEventListener("pointerlockchange", mudouCaptura);
    document.addEventListener("visibilitychange", mudouVisibilidade);

    scene.onDisposeObservable.add(() => {
        cenaEncerrada = true;
        musicaFundo.pause();
        musicaFundo.removeAttribute("src");
        musicaFundo.load();
        musicaVitoria.pause();
        musicaVitoria.removeAttribute("src");
        musicaVitoria.load();
        musicaDerrota.pause();
        musicaDerrota.removeAttribute("src");
        musicaDerrota.load();
        pararRespiracao();
        pararBatimentos();
        canvas.removeEventListener("pointerdown", ativarAudioPorInteracao);
        window.removeEventListener("keydown", ativarAudioTeclado);
        canvas.removeEventListener("click", capturarMouse);
        canvas.removeEventListener("mousedown", pressionarMouse);
        canvas.removeEventListener("contextmenu", bloquearMenu);
        canvas.removeEventListener("wheel", controlarZoomRoda);
        window.removeEventListener("mouseup", soltarMouse);
        window.removeEventListener("keydown", bloquearEscapePainelAudio210, true);
        window.removeEventListener("keydown", pressionarTecla);
        window.removeEventListener("keyup", soltarTecla);
        window.removeEventListener("blur", pausar);
        canvas.removeEventListener("mouseleave", cancelarGatilho);
        document.removeEventListener("pointerlockchange", mudouCaptura);
        document.removeEventListener("visibilitychange", mudouVisibilidade);
        limparRastros();
        ui.dispose();

        if (audio && audio.state !== "closed") {
            audio.close().catch(() => {});
        }
    });

    atualizarAlvos();
    alvos.forEach(atualizarBarraVida); // todas invisiveis ate o primeiro dano
    atualizarInterface();
    return scene;
};

    const scene = createScene();
    engine.runRenderLoop(() => {
      if (!scene.isDisposed()) scene.render();
    });
    window.addEventListener("resize", () => engine.resize());
    } catch (erro) {
      mostrarFalhaInicializacao(erro);
    }
  </script>
