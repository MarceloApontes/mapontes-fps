name: Diagnosticar drops ETAPA 357
on:
  push:
    branches: [desenvolvimento-etapa-355]
    paths:
      - 'scripts/aplicar_etapa357.py'
      - '.github/workflows/etapa357.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar diagnostico e verificar sintaxe
        run: |
          python3 scripts/aplicar_etapa357.py
          node --check jogo-principal.js
      - name: Publicar na branch de desenvolvimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogo-principal.js
          git commit -m "ETAPA 357: diagnostico de sorteio de ampulhetas"
          git push
