name: Aplicar ETAPA 356
on:
  push:
    branches: [desenvolvimento-etapa-355]
    paths:
      - 'scripts/aplicar_etapa356.py'
      - '.github/workflows/etapa356.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar-ampulhetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replicar ampulhetas nos tres mapas
        run: |
          python3 scripts/aplicar_etapa356.py
          node --check jogo-principal.js
      - name: Publicar somente na branch de desenvolvimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogo-principal.js
          git commit -m "ETAPA 356: drops de ampulheta nos tres mapas"
          git push
